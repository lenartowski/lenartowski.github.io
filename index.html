<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan Lenartowski</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fafafa;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 2rem;
            text-align: center;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #4a5568;
            margin: 2rem 0 1rem 0;
        }

        ul {
            list-style: disc;
            padding-left: 1.5rem;
        }

        li {
            margin-bottom: 0.75rem;
        }

        a {
            color: #3182ce;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
            display: inline-block;
            padding: 0.5rem 0;
        }

        a:hover {
            color: #2c5aa0;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .container {
                padding: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Jan Lenartowski Solutions</h1>

        <h2>Projects:</h2>
        <ul>
            <li><a href="https://byheart.io">byHeart - learning app</a></li>
        </ul>
        
        <h2>Other links:</h2>
        <ul>
            <li><a href="https://github.com/lenartowski">Github</a></li>
            <li><a href="https://www.linkedin.com/in/lenartowski/">Linkedin</a></li>
            <li><a href="#" onclick="location.href='mailto:' + 'jan' + '@' + 'lenartowski' + '.' + 'dev'; return false;"><span data-user="naj" data-domain="ved.ikswotranel"></span></a></li>
        </ul>
    </div>
    
    <script>
        // Decode and display obfuscated email
        document.addEventListener('DOMContentLoaded', function() {
            const emailSpan = document.querySelector('[data-user]');
            if (emailSpan) {
                const user = emailSpan.getAttribute('data-user').split('').reverse().join('');
                const domain = emailSpan.getAttribute('data-domain').split('').reverse().join('');
                emailSpan.textContent = user + '@' + domain;
            }
        });
    </script>
</body>

</html>
